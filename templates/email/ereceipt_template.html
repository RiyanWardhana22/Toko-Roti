<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>Pembayaran Berhasil - Pesanan #{{order_id}}</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        color: #333;
      }
      .container {
        max-width: 600px;
        margin: 20px auto;
        padding: 20px;
        border: 1px solid #eee;
        border-radius: 8px;
      }
      .header {
        text-align: center;
        border-bottom: 1px solid #eee;
        padding-bottom: 20px;
        margin-bottom: 20px;
      }
      .header h2 {
        margin: 0;
        color: #2ecc71;
      }
      .header .total {
        font-size: 24px;
        font-weight: bold;
        margin: 10px 0;
      }
      .info-section {
        margin-bottom: 20px;
      }
      .info-section h4 {
        border-bottom: 2px solid #f4f4f4;
        padding-bottom: 10px;
        margin-bottom: 15px;
        font-size: 16px;
        color: #555;
      }
      .info-grid {
        display: flex;
        flex-wrap: wrap;
      }
      .info-item {
        width: 50%;
        padding: 5px 0;
      }
      .info-item .label {
        color: #777;
      }
      .order-details-table {
        width: 100%;
        border-collapse: collapse;
        margin-bottom: 20px;
      }
      .order-details-table th,
      .order-details-table td {
        padding: 10px;
        text-align: left;
        border-bottom: 1px solid #eee;
      }
      .order-details-table th {
        font-size: 14px;
      }
      .footer {
        text-align: center;
        font-size: 12px;
        color: #999;
        margin-top: 30px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h2>Pembayaran Berhasil</h2>
        <div class="total">Rp {{total_amount}}</div>
        <div class="date">{{order_date}}</div>
      </div>
      <div class="info-section">
        <h4>Informasi Pesanan</h4>
        <div class="info-item">
          <span class="label">Nama Toko:</span><br /><strong
            >{{website_name}}</strong
          >
        </div>
        <div class="info-item">
          <span class="label">Nomor Pesanan:</span><br /><strong
            >#{{order_id}}</strong
          >
        </div>
        <div class="info-item">
          <span class="label">Nama Pelanggan:</span><br /><strong
            >{{customer_name}}</strong
          >
        </div>
        <div class="info-item">
          <span class="label">Metode Pembayaran:</span><br /><strong
            >{{payment_method}}</strong
          >
        </div>
      </div>
      <div class="info-section">
        <h4>Detail Pesanan</h4>
        {{order_details_table}}
      </div>
      <div class="footer">
        <p>Terima kasih telah berbelanja di {{website_name}}!</p>
      </div>
    </div>
  </body>
</html>
